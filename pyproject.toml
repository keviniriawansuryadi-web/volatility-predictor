[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility_tester"
version = "0.1.0"
description = "Volatility forecasting models (GARCH, HAR, ML) and portfolio vol aggregation"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["volatility_tester"]
package-dir = {"volatility_tester" = "src"}
