[flake8]
max-line-length = 120

# E402 (module import not at top of file) is ignored project-wide because
# every occurrence in this codebase is a required ordering constraint:
#   - src/* plotting modules call matplotlib.use("Agg") before importing pyplot
#   - scripts/* call sys.path.insert(...) / sys.stdout.reconfigure(...) before
#     importing the local `src` package
#   - app.py / main.py call warnings.filterwarnings(...) before heavy imports
# E226 (missing whitespace around arithmetic operator) is a stylistic default
# that conflicts with compact numeric expressions used throughout.
extend-ignore = E402, E226

# app.py embeds Markdown (table rows, citation URLs) inside st.markdown strings;
# those content lines cannot be wrapped without breaking rendering.
per-file-ignores =
    app.py: E501

exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    data,
    outputs
